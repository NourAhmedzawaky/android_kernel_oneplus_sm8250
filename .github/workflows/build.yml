name: Build KSU Next kernel (kebab, LOS 24.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev zip curl git \
            device-tree-compiler python3 wget lsb-release software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 llvm-18

      - name: Add KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Fix KSU patch_memory shim
        run: |
          sed -i '/^#define copy_to_kernel_nofault/,+1d' drivers/kernelsu/hook/patch_memory.c
          sed -n 8,20p drivers/kernelsu/hook/patch_memory.c
      - name: Manual hooks
        run: |
          git clone --depth=1 -b mainline https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd /tmp/ngki
          cp /tmp/ngki/Patches/syscall_hook_patches.sh /tmp/ngki/Patches/backport_patches.sh .
          bash syscall_hook_patches.sh
          bash backport_patches.sh
          grep -n ksu_handle_sys_reboot kernel/reboot.c
      - name: List defconfigs
        run: |
          ls arch/arm64/configs | grep -iE "kebab|lineage|sm8250|kona|oneplus|op8" || true
          ls arch/arm64/configs/vendor 2>/dev/null | head -80
          grep -nE "SCHGM|SMB5|OPLUS_CHG" arch/arm64/configs/vendor/kona-perf_defconfig || true
      - name: Backport path_umount
        run: |
          python3 - <<'EOF'
          p = 'fs/namespace.c'
          s = open(p).read()
          code = '''
          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }
          '''
          m = 'SYSCALL_DEFINE2(umount,'
          assert m in s, 'anchor not found'
          if 'int path_umount' not in s:
              s = s.replace(m, code + '\n' + m, 1)
          open(p, 'w').write(s)
          EOF
      - name: Build
        env:
          DEFCONFIG: vendor/kona-perf_defconfig
        run: |
          export PATH=/usr/lib/llvm-18/bin:$PATH
          MK="make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          $MK $DEFCONFIG
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/oplus.config
          scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK
          $MK olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBES" out/.config || true
          grep -nE "SMB5|SCHGM|OPLUS_CHG" arch/arm64/configs/vendor/oplus.config || true
          $MK Image > build.log 2>&1 || true
          echo "=== ERRORS ==="
          grep -nE "error:|undefined|\*\*\*" build.log | head -40 || true
          echo "=== LAST 25 LINES ==="
          tail -25 build.log
          test -f out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md
          cp ../out/arch/arm64/boot/Image .
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=KSU Next kebab
          do_devicecheck=1
          do_modules=0
          do_systemless=0
          do_cleanup=1
          do_cleanuponabort=0
          device.name1=OnePlus8T
          device.name2=kebab
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' anykernel.sh
          zip -r9 ../kebab-ksunext-los24.zip . -x '.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: kebab-ksunext-los24
          path: kebab-ksunext-los24.zip
